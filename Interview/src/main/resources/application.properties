spring.application.name=Interview

# ================= Database =================
spring.datasource.url=jdbc:postgresql://localhost:5432/interviewIQ
spring.datasource.username=postgres
spring.datasource.password=@Rohit110
spring.datasource.driver-class-name=org.postgresql.Driver

spring.ai.vectorstore.pgvector.initialize-schema=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true 

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ================= JWT =================
app.jwt.secret=change-this-to-a-long-random-secret-at-least-32-characters
app.jwt.expiration-ms=86400000
# ================= Groq Chat (via OpenAI-compatible API) =================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# ================= Gemini Chat =================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# ================= Gemini Embedding =================
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=1536

# ================= Model selection (disambiguates OpenAI vs Gemini) =================
spring.ai.model.chat=openai
spring.ai.model.embedding=google-genai