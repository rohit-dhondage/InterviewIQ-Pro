spring.application.name=Interview
server.port=${PORT:8080}
server.address=0.0.0.0

# ================= Database =================
#spring.datasource.url=jdbc:postgresql://localhost:5432/interviewIQ
#spring.datasource.username=postgres
#spring.datasource.password=@Rohit110
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://ep-old-salad-b3io07nv-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

spring.ai.vectorstore.pgvector.initialize-schema=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false 

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
# ================= CORS =================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://interview-iq-pro-front-end.vercel.app,http://localhost:5173,http://localhost:5174}

# ================= JWT =================
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# ================= Groq Chat (via OpenAI-compatible API) =================
spring.ai.openai.api-key=${GROQ_API_KEY:demo_groq_key}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# ================= Gemini Chat =================
spring.ai.google.genai.api-key=${GEMINI_API_KEY:demo_gemini_key}

# ================= Gemini Embedding =================
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:demo_gemini_key}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=1536

# ================= Model selection (disambiguates OpenAI vs Gemini) =================
spring.ai.model.chat=openai
spring.ai.model.embedding=google-genai



# ================= Resume Storage =================
app.storage.resume-dir=${RESUME_STORAGE_DIR:uploads/resumes}
app.storage.max-resume-size-mb=5

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# ================= Cloudinary =================
cloudinary.url=${CLOUDINARY_URL} 